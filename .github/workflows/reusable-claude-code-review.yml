## AI-Assisted

## Reusable workflow: Anthropic Claude review, driven ONLY by an
## '@claude' mention in an issue comment or a PR review comment.
##
## ## Why mention-only, and why 'pull_request' is not a trigger
##
## claude-code-action auto-detects its mode from the event. On a
## 'pull_request' event it selects AGENT mode, whose trigger
## condition is literally "the 'prompt' input is non-empty". This
## workflow passes no prompt, so a pull_request run reaches:
##
##   Auto-detected mode: agent for event: pull_request
##   Context prompt: NO PROMPT
##   Trigger result: false
##   No trigger found, skipping remaining steps
##
## and exits 0 without ever calling the model. A green "Claude Code
## Review" check that reviewed nothing is worse than no check at all,
## so the consumer wrapper does not carry a 'pull_request' trigger.
##
## Real auto-review means passing a 'prompt:' input, which spends
## Claude subscription quota on every PR open and every push to a PR
## branch. That is a deliberate opt-in decision per org, not a
## default, and it is not wired here.
##
## On a comment event with no prompt the action selects TAG mode,
## whose trigger IS the '@claude' phrase, and the model runs.
##
## 'workflow_dispatch' is likewise absent: it resolves to agent mode,
## so with no prompt it can only ever no-op.
##
## ## Both comment triggers are kept deliberately
##
## GitHub creates a workflow run BEFORE evaluating any 'if:', and the
## comment events accept only 'types:' - there is no filter on comment
## body, author or author_association, and no workflow-level 'if:'.
## The consumer's 'contains(..., '@claude')' gate is therefore the
## earliest filter that exists; it saves the runner minute, not the
## run record. Measured over 30 days across the consuming repos: 405
## comment-triggered runs, 384 skipped, 95% of them authored by bots
## (CodeRabbit, github-advanced-security) rather than people.
##
## Dropping 'pull_request_review_comment' would remove all of the grey
## skipped checks that appear on a PR - that event attaches its run to
## the PR HEAD, whereas 'issue_comment' attaches to the default-branch
## tip, where no PR displays it. It is kept anyway, on purpose: being
## able to say '@claude' inside an inline review thread, aimed at one
## specific line, is worth the cosmetic noise. Do not "optimise" this
## trigger away on a reading of the skipped-run count alone.
##
## ## Trust footprint
##
## anthropics/claude-code-action - SHA-pinned. Authenticates with the
## caller's CLAUDE_CODE_OAUTH_TOKEN, i.e. the Claude subscription,
## drawing down the same allowance as interactive Claude Code
## sessions. The action reports no remaining quota anywhere; see the
## usage-record steps below for what this workflow does capture.
##
## ## The calling job's 'permissions:' does NOT bound Claude
##
## The action discards the runner's GITHUB_TOKEN. It requests an OIDC
## token, exchanges it at Anthropic's gateway for a claude[bot]
## GitHub App installation token, and acts with that:
##
##   Requesting OIDC token...
##   Exchanging OIDC token for app token...
##   Using GITHUB_TOKEN from OIDC
##
## That installation token is bounded by the App's own grant
## (contents / issues / pull-requests write, this repository only),
## NOT by the 'permissions:' block on the job. 'contents: read' below
## therefore does not stop Claude committing and pushing to the PR
## branch: tag mode grants it Bash(git add/commit/push) plus
## --permission-mode acceptEdits. The block is still required because
## 'id-token: write' is what the OIDC exchange needs - without it the
## action fails with "Could not fetch an OIDC token".
##
## ## The "cache write denied" warning is CORRECT - do not silence it
##
## Every run ends with a yellow annotation:
##
##   Cache reservation failed: cache write denied:
##     token has no writable scopes
##
## It comes from the oven-sh/setup-bun step INSIDE claude-code-action,
## which tries to save its ~32 MB Bun download to the Actions cache.
## The permissions block below grants no 'actions:' scope, so the save
## is refused. Cache RESTORE is unaffected and still hits.
##
## Adding 'actions: write' would silence it and is the wrong fix. Per
## agents/github-actions.md G-A-007, actions/cache extracts archives
## without integrity checks, so a job holding a cache-writable
## ACTIONS_RUNTIME_TOKEN can poison entries the default branch then
## consumes. This is the one workflow that feeds untrusted PR content
## to an agent with tool access, i.e. exactly where code execution is
## most plausible - it is the last job in the org that should be able
## to write the cache.
##
## The action exposes no input to skip its bun cache. Setting
## 'path_to_bun_executable' WOULD remove the warning -- it makes the
## setup-bun step conditional-out entirely, so nothing tries to write
## the cache -- but it was evaluated and rejected:
##
## - The action hardcodes 'bun-version: 1.3.14' for its own install
##   and performs NO validation on a supplied executable. We would
##   silently own a version-compatibility contract with the action's
##   internals, renegotiated on every SHA bump, with nothing to detect
##   skew: it surfaces as the agent breaking oddly, not as a clear
##   error.
## - We would have to fetch and pin bun ourselves, adding a
##   supply-chain surface to maintain.
##
## That is a real, recurring maintenance hazard traded for a cosmetic
## warning and a second of download. Leave the warning.
##
## ## The actor must hold WRITE on the consuming repository
##
## The gateway refuses the exchange for an actor without write
## access, and does so AFTER the roster gate below has already let
## the run through:
##
##   App token exchange failed: 401 Unauthorized -
##     User does not have write access on this repository
##   ##[error]Action failed with error: ...
##
## That is a hard job FAILURE (red X on the PR), not a skip, and no
## review is posted. 'allowed-users' must therefore list only
## accounts that actually hold write on every consuming repository.
##
## ## Prompt-injection surface
##
## Tag mode feeds the PR diff, the PR title/body and comment bodies
## to a model that holds commit-push rights on this repository. The
## roster gate governs who may TRIGGER a run, not whose content gets
## read: mentioning '@claude' on an untrusted contributor's PR points
## the agent at that contributor's text. The action restores
## '.claude/' and '.mcp.json' from the base branch before the CLI
## reads them, which covers agent config but not diff content.
##
## ## Secret isolation
##
## 'workflow_call.secrets' is documentation - 'secrets: inherit'
## bypasses it. Callers must use an explicit 'secrets:' map for the
## schema to actually constrain what flows in. Run
## .github/workflows/consumer-secrets-audit.yml manually
## (workflow_dispatch) to verify the secrets context.
##
## ## Caller responsibilities
##
## - Define the trigger schedule (issue_comment +
##   pull_request_review_comment, types: [created]). Schedule cannot
##   live in a reusable workflow per GitHub Actions G-A-002.
## - Hardcode the owner in 'jobs.<id>.uses:' (G-A-001).
## - Own the concurrency lock, keyed by PR/issue number (G-A-006).
## - Forward via an explicit 'secrets:' map, not 'inherit'.
## - Grant the job-level permissions block from the caller example.
##
## ## Inputs
##
## - allowed-users    (optional)  Comma-separated GitHub usernames
##                                allowed to trigger @claude. Every
##                                listed account MUST hold write on
##                                the consuming repository (see
##                                above). Default is the org roster.
## - timeout-minutes  (optional)  Job timeout. Default 30.
##
## Two independent caps bound what one mention can spend, and
## whichever binds first wins: timeout-minutes on wall clock, and the
## hardcoded 'claude_args: --max-turns' on agent turns (see the step
## below). Wall clock alone does not bound a fast spin loop, and a
## turn cap alone does not bound one slow turn. Only the turn cap
## ends the run as a job FAILURE; a timeout is a cancellation.
##
## ## Secrets
##
## - CLAUDE_CODE_OAUTH_TOKEN  (required)  Claude subscription OAuth
##                                  token (claude setup-token). Set at
##                                  org level; every consumer wrapper
##                                  forwards it explicitly.
##
## ## Caller example
##
##   name: Claude Code Review
##   on:
##     issue_comment:
##       types: [created]
##     pull_request_review_comment:
##       types: [created]
##   permissions:
##     contents: read
##   concurrency:
##     group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}-${{ endsWith(github.actor, '[bot]') && 'bot' || 'human' }}
##     cancel-in-progress: true
##   jobs:
##     review:
##       if: contains(github.event.comment.body, '@claude')
##       uses: org-ai-assisted/developer-meta-files/.github/workflows/reusable-claude-code-review.yml@master
##       secrets:
##         CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
##       permissions:
##         contents: read
##         pull-requests: write
##         issues: write
##         id-token: write

name: Claude Code Review (reusable)

on:
  workflow_call:
    inputs:
      ## Org-canonical reviewer roster. Single source of truth -
      ## consumer wrappers inherit this default rather than
      ## redeclaring the list per repo. Every entry must hold write on
      ## every consuming repo, or the OIDC token exchange 401s and the
      ## job fails RED after this gate has already passed it through.
      ## `claude-roster-verify` (private-ai-config) checks this list
      ## against live permissions; run it after editing the list, and
      ## grant write before adding a name rather than after.
      allowed-users:
        required: false
        type: string
        default: "adrelanos,ArrayBolt3,assisted-by-ai"
      timeout-minutes:
        required: false
        type: number
        default: 30
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read

## No reusable-side concurrency block. Per agents/github-actions.md
## G-A-006: github.workflow inside a reusable resolves to the
## caller's workflow name, so a reusable that declares a group key
## the caller cannot disambiguate produces an identical lock to the
## caller's and self-cancels (Actions surfaces this as "Canceling
## since a deadlock was detected for concurrency group: ..."). The
## caller's lock lives in consumer-claude-code.yml and carries the
## PR/issue-number disambiguator required for comment events; that
## lock covers this reusable's runs.

jobs:
  review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    ## Job-level gate, two purposes:
    ##
    ## 1. Only run when the comment body actually mentions @claude.
    ##    Without this the runner would spin up for every comment on
    ##    every issue and PR, the action would no-op internally, and
    ##    minutes would burn for nothing.
    ##
    ## 2. Restrict to the configured roster, so an outside commenter
    ##    cannot spend the org's Claude subscription by spamming
    ##    @claude, and so a compromised action-side actor check
    ##    cannot be the only thing standing in the way.
    ##
    ## 3. CI runs only where we enabled it. In a CALLED reusable the vars
    ##    context resolves against the CALLER, so this gates every
    ##    consumer. It is the outermost condition on purpose: an @claude
    ##    mention on a fork or upstream must not spend the org's
    ##    subscription even if the commenter happens to be on the roster.
    ##
    ## The substring match wraps both haystack and needle in commas
    ## so that "bob" does not match "alice,bobby,charlie".
    if: |
      vars.CI_ENABLED_ORG_AI_ASSISTED == 'true' &&
      contains(format(',{0},', inputs.allowed-users), format(',{0},', github.actor)) && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
      )
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    env:
      DIST_AI_REF: ${{ github.repository == 'org-ai-assisted/dist-ai' && github.sha || 'master' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10  # v1.0.210
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ## No 'allowed_users' input exists on the action; the
          ## roster gate is the job's 'if:' above, which runs before
          ## a runner is even allocated. The action's own default
          ## (any actor with repo write) is the second layer, and
          ## ci/claude-roster-verify.sh keeps the two in agreement.
          ##
          ## Turn cap. 'timeout-minutes' bounds wall clock but not
          ## how much quota a wedged agent loop can spend inside it,
          ## and a subscription run reports no remaining quota. 60 is
          ## roughly twice what a mention-driven review takes, so it
          ## does not truncate real work while still ending a
          ## pathological loop. Note the failure mode: exhausting the
          ## cap surfaces as subtype 'error_max_turns', which the
          ## action raises to core.setFailed, so the job goes RED
          ## rather than posting a partial review.
          claude_args: --max-turns 60

      ## 'execution_file' is only set when the model actually ran -
      ## the no-op path returns before the inner action produces it.
      ## Its presence is therefore the authoritative "subscription
      ## quota was spent on this run" signal, and the two steps below
      ## turn that into a durable, collectable record. Without them a
      ## run leaves no trace of how much it cost: the action's own
      ## cost report is behind 'display_report', which is off by
      ## default and which would splice model-authored text into the
      ## job summary.
      ## The recorder ships in dist-ai, which is not a dependency of the
      ## review itself - fetch it only on the path that runs it. DIST_AI_REF
      ## dogfoods: the caller's own commit when dist-ai IS the caller, so a
      ## PR that edits claude-usage-record exercises the EDITED recorder
      ## rather than master's copy; plain 'master' for every other caller,
      ## whose github.sha names a commit in a different repository.
      - name: Checkout dist-ai (usage recorder)
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: org-ai-assisted/dist-ai
          ref: ${{ env.DIST_AI_REF }}
          path: .github/dist-ai
          persist-credentials: false

      - name: Record Claude usage
        if: always() && steps.claude.outputs.execution_file != ''
        ## Values are routed through env and consumed with
        ## shell-native expansion so no expression interpolation
        ## lands in a shell argument (CodeQL
        ## js/actions/command-injection).
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          USAGE_FILE: ${{ runner.temp }}/claude-usage.json
          JOB_STATUS: ${{ job.status }}
        run: |
          ./.github/dist-ai/usr/bin/claude-usage-record \
            --execution-file "${EXECUTION_FILE}" \
            --output "${USAGE_FILE}" \
            --job-status "${JOB_STATUS}"

      - name: Upload Claude usage record
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: claude-usage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-usage.json
          if-no-files-found: error
