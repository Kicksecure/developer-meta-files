## AI-Assisted

## Reusable workflow: CI mirror of the pre-push-static gate (which now
## ships in dist-ai as usr/bin/pre-push-static).
##
## Runs the unified static-checks gate developers run locally as
## .git/hooks/pre-push. Local hook installation is opt-in per
## developer; this CI gate is mandatory and catches what the local
## hook misses (developers who didn't install it, AI sessions that
## didn't read the docs, environments lacking pre-commit-hooks).
##
## Checks enforced (see dist-ai's usr/bin/pre-push-static head comment
## for the authoritative list):
##   - bash -n on changed shell scripts
##   - shellcheck --external-sources on the same set
##   - R-001 ASCII on files + commit-range messages
##   - R-010, R-011, R-042, R-051, R-070, R-074, R-081, R-090,
##     R-102, R-120, R-130 (Tier-1 single-grep style-guide rules)
##   - pre-commit-hooks binaries (direct execution, no framework)
##     against the right file-type subsets: check-yaml,
##     check-json, check-toml, check-xml, check-ast, check-added-
##     large-files, check-merge-conflict, detect-aws-credentials,
##     detect-private-key, end-of-file-fixer, ...
##
## Runs in a Debian trixie container because:
##   * pre-commit-hooks is NOT in Debian bookworm (stable) apt.
##   * pre-commit-hooks is NOT in Ubuntu noble (24.04 = current
##     ubuntu-latest in GH Actions) apt either.
##   * pre-commit-hooks IS in Debian trixie apt (5.0.0+dfsg-5).
## apt-only by org preference; no pip fallback. shellcheck is also
## apt-installable in trixie, so a single container covers both.
##
## No 'concurrency:' block per the secrets-audit precedent:
## github.workflow inside a reusable resolves to the original
## caller's workflow name; a group declared here would deadlock
## with the caller's group.

name: pre-push static gate (reusable)

on:
  workflow_call:
    inputs:
      base-ref:
        description: 'Git ref to diff against. Default: PR base for pull_request, origin/master otherwise.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  gate:
    name: pre-push static gate
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim

    ## Fork-PR guard: a no-op unless the caller routes pull_request
    ## events into us, in which case it blocks PRs from forks. The
    ## dogfooding arm below checks out dist-ai at github.sha when the
    ## caller IS dist-ai - a fork PR there would mean attacker-controlled
    ## gate-script content runs in the runner. Same-repo branch PRs
    ## still run; those go
    ## through code review (members all have write) and are trusted
    ## by the threat model in agents/security.md. Matches the guard
    ## on reusable-bandit/codeql/scorecard/cppcheck. Closes CodeQL
    ## actions/untrusted-checkout/medium alert #15.
    ## CI runs only where we enabled it. In a CALLED reusable the vars
    ## context resolves against the CALLER's repository and org, so this
    ## one condition gates every consumer -- upstream and forks skip with
    ## no runner allocated and the run stays green, rather than taking a
    ## red X for a lane they never opted into. A fork that WANTS the lane
    ## sets the same variable in its own repo; no patch to our files.
    ##
    ## ANDed with the fork-PR guard, which stays.
    if: >-
      vars.CI_ENABLED_ORG_AI_ASSISTED == 'true'
      && (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request')

    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ## Resolution order: explicit input > PR base ref > the push's own
      ## before-sha > master fallback. Single GitHub expression keeps this thin
      ## per R-100 (no bash control flow in run: blocks).
      ##
      ## The before-sha branch is what makes a push run mean anything. On
      ## 'push' github.base_ref is empty, so this resolved to 'origin/master'
      ## -- which after the push IS the pushed head. The range
      ## origin/master...HEAD was therefore empty and the gate reported
      ## "no changed shell files" and passed, having examined nothing. Only the
      ## commit-time hook actually gated those commits.
      ##
      ## An all-zero before-sha (a branch's first push, so there is no prior
      ## head) falls through to origin/master rather than naming a commit that
      ## does not exist.
      BASE_REF: >-
        ${{
          inputs.base-ref != '' && inputs.base-ref
          || (github.base_ref != '' && format('origin/{0}', github.base_ref)
          || (github.event_name == 'push'
              && github.event.before != '0000000000000000000000000000000000000000'
              && github.event.before
          || 'origin/master'))
        }}
      ## Dogfood ref: the caller's commit when dist-ai is its own caller,
      ## so a PR that modifies pre-push-static or step-summary-emit is
      ## exercised by this job; 'master' for every other caller, whose
      ## github.sha names a commit in a different repository. Routed
      ## through env for the org-wide env-routing convention (same shape
      ## as BASE_REF / JOB_STATUS). The job-level fork-PR guard above is
      ## the actual mitigation for actions/untrusted-checkout.
      DIST_AI_REF: ${{ github.repository == 'org-ai-assisted/dist-ai' && github.sha || 'master' }}
    steps:
      - name: Install dependencies (apt only)
        ## R-100: 4 lines, no control flow -- inline is acceptable.
        ## file: required by is_text_file()'s MIME-type fallback for
        ## extension-less text files.
        run: |
          apt-get update --quiet
          apt-get install --yes --no-install-recommends \
            ca-certificates file git pre-commit-hooks shellcheck yq
          git config --global --add safe.directory '*'

      - name: Checkout caller repo (full history for git diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout dist-ai (gate script)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: org-ai-assisted/dist-ai
          ref: ${{ env.DIST_AI_REF }}
          path: .github/dist-ai
          persist-credentials: false

      - name: Load per-repo config (.github/dm-consumer.yml)
        id: cfg
        ## Runtime read of the caller's per-repo config (reusable-dist-ai-tests
        ## pattern). All logic lives in the committed dist-ai/ci script, not
        ## inline here (no embedded shell scripts in CI files). Emits
        ## helper_scripts=true when the repo opts in below.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: ./.github/dist-ai/ci/pre-push-static-ci-config.sh .github/dm-consumer.yml

      - name: Checkout helper-scripts (shellcheck cross-repo source resolution)
        ## OPT-IN, via the SAME 'dist-ai-tests: helper-scripts: true' flag a
        ## consumer already sets in .github/dm-consumer.yml -- so a repo that
        ## sources helper-scripts opts in once. Consumers source it via a
        ## '# shellcheck source=../../../../helper-scripts/...' directive, a path
        ## RELATIVE to the script that reaches a SIBLING of the repo root. In the
        ## isolated CI checkout that sibling is absent, so 'shellcheck -x' emits
        ## SC1091 and the consumer silences it with an inline
        ## '# shellcheck disable=SC1091'. Provide the sibling so shellcheck
        ## FOLLOWS the source instead (and the disable can be dropped). Same
        ## org-ai-assisted/helper-scripts@master the dist-ai tests use;
        ## master-tracking is sanctioned for our own repos.
        if: >-
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          && steps.cfg.outputs.helper_scripts == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: org-ai-assisted/helper-scripts
          ref: master
          path: .ci-helper-scripts
          persist-credentials: false

      - name: Link helper-scripts as the repo sibling
        ## The caller repo is checked out at the workspace root, so the sibling
        ## the source= paths reach is one level ABOVE it, which actions/checkout
        ## cannot target (its 'path' must stay under the workspace). Symlink it
        ## from the in-workspace checkout above. Untracked, so the gate's
        ## git-diff file scan never sees it. R-100: one command, no control flow.
        if: >-
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          && steps.cfg.outputs.helper_scripts == 'true'
        run: ln -sfn "${GITHUB_WORKSPACE}/.ci-helper-scripts" "${GITHUB_WORKSPACE}/../helper-scripts"

      - name: Run pre-push-static
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: ./.github/dist-ai/usr/bin/pre-push-static "${BASE_REF}"

      - name: Emit step summary
        ## Carries the fork-PR guard as well as always(): on a fork PR the
        ## helper checkout above is skipped, so a bare always() would call
        ## a binary that is not on disk and turn a deliberately-skipped
        ## gate into a red job.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        ## Per-hook FAIL details remain in the gate step's log;
        ## this panel surfaces the headline result and the base ref
        ## so the PR Checks tab tells the reader what was diffed.
        ## R-100 compliant (no control flow).
        ##
        ## Template-substituted values (job.status here) MUST flow
        ## through env: so they cannot break out of the run: block
        ## via shell metacharacters - same pattern as #80/#84/#86.
        ## job.status itself is GitHub-controlled, but env routing
        ## is the org-wide convention regardless, and CodeQL flags
        ## inline ${{ ... }} in run: bodies.
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          ./.github/dist-ai/usr/bin/step-summary-emit \
            --tool 'pre-push static gate' \
            --column-header field \
            --row "outcome=${JOB_STATUS}" \
            --row "base-ref=${BASE_REF}"
