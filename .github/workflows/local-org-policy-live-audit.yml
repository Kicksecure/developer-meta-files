## AI-Assisted

## Manual-trigger live-API policy check. Runs `dm-github-org-policy
## --audit` followed by `dm-github-org-policy --dry-run` against the real
## GitHub REST API using the GHORG_AUDIT_TOKEN repo secret (a
## fine-grained PAT scoped read-only to org-ai-assisted). No writes;
## no fork CI; only fires when an authorized user clicks "Run
## workflow" from the Actions tab.
##
## --audit prints the current org state. --dry-run prints the
## PATCH/PUT/POST calls it WOULD make (prefixed "DRY-RUN:") but
## never actually mutates anything; both are GET-only on the live
## API and are safe with a read-only PAT. If --audit fails, --dry-run
## does not run (default GitHub Actions step ordering).
##
## To enable:
##   1. Mint a fine-grained PAT under the user that owns
##      org-ai-assisted access (read-only on Repository:
##      Administration/Contents/Metadata/Webhooks and Organization:
##      Administration/Members/Webhooks).
##   2. Settings -> Secrets and variables -> Actions -> New repository
##      secret named GHORG_AUDIT_TOKEN.
##   3. Actions tab -> "github-org tools (live policy check)"
##      workflow -> Run workflow.
##
## To revoke: delete the secret in the same UI, or revoke the PAT in
## the user's Developer settings.

name: github-org tools (live policy check)

on:
  workflow_dispatch:

## org-ai-assisted-only gate. The literal "org-ai-assisted/developer-meta-files"
## in the job-level `if:` below pins this workflow to our CI home and
## prevents any other repo (including the Kicksecure upstream mirror)
## from running this workflow's secret-dependent paths - the secret(s)
## referenced below (Coverity token / GHORG_AUDIT_TOKEN, an
## org-ai-assisted-scoped read-only PAT) are only set on
## org-ai-assisted/developer-meta-files. Another repo would either see
## those secrets as empty and fail mid-flight, or - worse - run the
## heavy ops with its own arbitrary-named secret.
##
## The canonical owner/repo is inlined in the `if:` rather than
## hoisted to a workflow-level `env:` constant because GitHub Actions
## does not expose the `env` context in job-level `if:` expressions
## (only `github`, `inputs`, `needs`, and `vars` are available there).

## Read-only on the checked-out source. Neither --audit nor --dry-run
## touches the repository content; both only call the GitHub REST API.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-policy-check:
    name: dm-github-org-policy --audit + --dry-run (live)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: debian:trixie

    ## Pin to org-ai-assisted so no other repo's workflow can use the
    ## secret (GitHub also blocks this by default for forked PRs, but
    ## the explicit guard documents intent).
    ## ANDed with the CI-enabled variable, the org-wide switch every
    ## workflow of ours carries. The repo pin above is the tighter of the
    ## two and stays: it is what keeps the secret to this one repo.
    if: >-
      ${{ github.repository == 'org-ai-assisted/developer-meta-files'
      && vars.CI_ENABLED_ORG_AI_ASSISTED == 'true' }}

    env:
      DIST_AI_REF: ${{ github.repository == 'org-ai-assisted/dist-ai' && github.sha || 'master' }}
    steps:
      - name: Checkout developer-meta-files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout dist-ai (shared CI helper binaries)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: org-ai-assisted/dist-ai
          ref: ${{ env.DIST_AI_REF }}
          path: .github/dist-ai
          persist-credentials: false

      - name: Install genmkfile + helper-scripts + self
        uses: ./.github/actions/install-deps
        with:
          apt-packages: ca-certificates curl jq git sudo build-essential dctrl-tools python3 safe-rm
          install-self: 'true'

      - name: Verify token secret is set
        env:
          TOKEN_PRESENT: ${{ secrets.GHORG_AUDIT_TOKEN != '' }}
        run: ./ci/policy-live-verify-token.sh

      - name: Run dm-github-org-policy --audit (live)
        env:
          GITHUB_TOKEN: ${{ secrets.GHORG_AUDIT_TOKEN }}
        run: dm-github-org-policy --audit

      - name: Run dm-github-org-policy --dry-run (live)
        env:
          GITHUB_TOKEN: ${{ secrets.GHORG_AUDIT_TOKEN }}
        run: dm-github-org-policy --dry-run

      ## The Claude review roster check deliberately does NOT live here.
      ## It needs to list an org's repos and read collaborator
      ## permissions, which wants an org-scoped token; the only one
      ## named in this workflow is GHORG_AUDIT_TOKEN, a secret that has
      ## never been created (this workflow has 0 runs, ever). A check
      ## wired to a job that cannot start verifies nothing. It runs
      ## operator-side instead, as `claude-roster-verify` in
      ## private-ai-config, where the bot token already has org access.

      - name: Emit step summary
        if: always()
        ## Minimal panel surfacing pass/fail. The audit / dry-run
        ## findings themselves stay in the step logs; this is a
        ## headline indicator for the Actions tab. Template values
        ## routed through env: per #87 to avoid CodeQL flagging.
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          ./.github/dist-ai/usr/bin/step-summary-emit \
            --tool 'github-org tools (live policy check)' \
            --column-header field \
            --row "outcome=${JOB_STATUS}" \
            --row "modes=audit + dry-run"
